VoxelFeatureEncoder:
  class: VoxelFeatureExtractorV3
  opt: none  # no learnable parameters

MiddleSparseEncoder:
  class: SpMiddleNoDownsampleXYWithSE
  net_kwargs:
    output_shape: [1, 30, 407, 407, 16]
    num_input_features: 4
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5
BEVClassifier:
  class: InpaintingFCHardNetSkip1024WithTransformer
  net_kwargs:
    num_class: 5
    num_input_features: 192
    num_heads: 8
    mlp_ratio: 4.0
    drop_path: 0.1
    # 可以选择在哪些位置添加transformer
    attention_positions: ['after_layer2', 'after_layer3', 'decoder_layer1']
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5