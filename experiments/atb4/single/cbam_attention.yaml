
VoxelFeatureEncoder:
  class: VoxelFeatureExtractorV3
  opt: none

MiddleSparseEncoder:
  class: SpMiddleNoDownsampleXYWithAttention
  net_kwargs:
    output_shape: [1, 30, 407, 407, 16]
    num_input_features: 4
    use_attention: 'cbam'
    attention_reduction: 16
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5

BEVClassifier:
  class: InpaintingFCHardNetSkip1024WithCBAM
  net_kwargs:
    num_class: 5
    num_input_features: 192
    attention_positions: ['after_block2', 'after_block3', 'after_block4', 'decoder_block1', 'before_output']
    attention_reduction: 16
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5