

VoxelFeatureEncoder:
  class: VoxelFeatureExtractorV3
  opt: none

MiddleSparseEncoder:
  class: SpMiddleNoDownsampleXYWithSE
  net_kwargs:
    output_shape: [1, 30, 407, 407, 16]
    num_input_features: 4
  <<: *default_opt

BEVClassifier:
  class: InpaintingResNet18WithSE
  net_kwargs:
    num_class: *num_class
    num_input_features: 192
  <<: *default_opt

loss:
  name: "CrossEntropy"
  # class_weights: [1.0, 1.0, 1.0, 1.0]