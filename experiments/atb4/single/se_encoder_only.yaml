
VoxelFeatureEncoder:
  class: VoxelFeatureExtractorV3
  opt: none

MiddleSparseEncoder:
  class: SpMiddleNoDownsampleXYWithSE  # 带SE的版本
  net_kwargs:
    output_shape: [1, 30, 407, 407, 16]
    num_input_features: 4
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5

BEVClassifier:
  class: InpaintingResNet18  # 原始版本，无注意力
  net_kwargs:
    num_class: *num_class
    num_input_features: 192
  opt: Adam
  opt_kwargs:
    lr: 3.0e-4
    eps: 1.0e-5

loss:
  name: "CrossEntropy"